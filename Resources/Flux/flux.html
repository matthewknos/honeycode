const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: false });
let W, H, DPR;

// Theme-aware: in dark mode the source ribbon (coloured-on-white) is keyed onto
// a slate background so the green/blue strands read on dark.
const FLUX_DARK = document.documentElement.getAttribute('data-theme') === 'dark';
const FLUX_BG = FLUX_DARK ? '#0b1a2e' : '#ffffff';
const FLUX_BG_RGB = [11, 26, 46]; // #0b1a2e

// Off-screen buffer holding the source image at canvas size
let srcCanvas, srcCtx, srcData;

const img = new Image();
img.crossOrigin = 'anonymous';
img.src = IMG_SRC;

let imgReady = false;
img.onload = () => { imgReady = true; layout(); };

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  if (document.documentElement.classList.contains('is-standalone')) {
    canvas.style.width = '';
    canvas.style.height = '';
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width || window.innerWidth));
    H = Math.max(1, Math.round(rect.height || (window.innerHeight - 92)));
  } else {
    W = window.innerWidth;
    H = window.innerHeight;
  }
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (!imgReady) return;

  // Build source buffer: image fit to viewport (contain), centered, on white
  srcCanvas = document.createElement('canvas');
  srcCanvas.width = Math.floor(W * DPR);
  srcCanvas.height = Math.floor(H * DPR);
  srcCtx = srcCanvas.getContext('2d');
  srcCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  srcCtx.imageSmoothingEnabled = true;
  srcCtx.imageSmoothingQuality = 'high';

  srcCtx.fillStyle = FLUX_BG;
  srcCtx.fillRect(0, 0, W, H);

  // Fit-cover so the ribbon spans the screen nicely
  const ir = img.width / img.height;
  const vr = W / H;
  let dw, dh, dx, dy;
  if (ir > vr) {
    // image wider than viewport — match height, crop sides slightly
    dh = H;
    dw = H * ir;
    dx = (W - dw) / 2;
    dy = 0;
  } else {
    dw = W;
    dh = W / ir;
    dx = 0;
    dy = (H - dh) / 2;
  }
  srcCtx.drawImage(img, dx, dy, dw, dh);

  // Dark mode: blend the image's white background toward slate, keeping the
  // coloured green/blue ribbons so they glow on dark. Runs once per layout.
  if (FLUX_DARK) {
    const id = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
    const d = id.data;
    const br = FLUX_BG_RGB[0], bg = FLUX_BG_RGB[1], bb = FLUX_BG_RGB[2];
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      // w = how "background-white" this pixel is (0 for ribbons, 1 for white)
      const w = Math.max(0, Math.min(1, (lum - 140) / 115));
      d[i]     = Math.round(r * (1 - w) + br * w);
      d[i + 1] = Math.round(g * (1 - w) + bg * w);
      d[i + 2] = Math.round(b * (1 - w) + bb * w);
    }
    srcCtx.putImageData(id, 0, 0);
  }
  srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
}

window.addEventListener('resize', layout);

// Smooth multi-octave noise (cheap, looks fluid)
function noise(x, y, t) {
  return (
    Math.sin(x * 1.20 + t * 0.55) * 0.55 +
    Math.sin(y * 1.55 - t * 0.45) * 0.32 +
    Math.sin((x + y) * 0.85 + t * 0.38) * 0.22 +
    Math.sin(x * 2.40 - y * 1.05 + t * 0.72) * 0.16 +
    Math.sin((x - y) * 0.6 + t * 0.25) * 0.12
  );
}

let paused = false;
let intensityLevel = 1;
const intensities = [
  { amp: 14, scale: 0.0028, speed: 0.00045 }, // gentle
  { amp: 26, scale: 0.0034, speed: 0.00060 }, // default
  { amp: 44, scale: 0.0042, speed: 0.00090 }, // wild
];

let time = 0;
let lastT = performance.now();

function frame(now) {
  const dt = Math.min(60, now - lastT);
  lastT = now;
  if (!paused) time += dt * intensities[intensityLevel].speed;

  if (!imgReady || !srcData) {
    requestAnimationFrame(frame);
    return;
  }

  const { amp, scale } = intensities[intensityLevel];
  const sw = srcCanvas.width;
  const sh = srcCanvas.height;

  // We draw slim vertical strips, each offset along a flow field.
  // Strip width balances smoothness vs perf.
  const stripW = 6; // device px in source space — visually we draw at DPR-adjusted
  const stripWCss = stripW / DPR;

  // Clear with the source's white
  ctx.fillStyle = FLUX_BG;
  ctx.fillRect(0, 0, W, H);

  // Iterate columns of the OUTPUT in css px, sample shifted columns from source
  for (let x = 0; x < W; x += stripWCss) {

    const nx = x * scale;
    const t = time;

    // Sample top and bottom of strip with different noise values for shear
    const nTop = noise(nx, 0, t);
    const nBot = noise(nx, H * scale, t + 0.7);

    const dxTop = nTop * amp;
    const dyTop = Math.sin(nTop * 1.7 + t * 0.9) * amp * 0.7;
    const dxBot = nBot * amp;
    const dyBot = Math.sin(nBot * 1.7 - t * 0.8) * amp * 0.7;

    // Average offset for this strip (using a single drawImage call per strip — fast)
    const dx = (dxTop + dxBot) * 0.5;
    const dy = (dyTop + dyBot) * 0.5;

    // Source rect in device pixels
    const sx = Math.max(0, Math.min(sw - stripW, (x - dx) * DPR));
    const sy = Math.max(0, Math.min(sh - 1, dy * DPR));
    const sH = sh - Math.max(0, sy);

    // Draw the strip with vertical offset (translate dy in css px)
    ctx.drawImage(
      srcCanvas,
      sx, 0, stripW, sh,                    // source
      x, dy, stripWCss + 0.5, H              // dest (+0.5 to avoid seams)
    );
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);



window.setFluxTheme = function(theme) {
  document.documentElement.setAttribute('data-theme', theme);
};
window.setFluxPaused = function(shouldPause) {
  paused = shouldPause;
};

document.getElementById('pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'play' : 'pause';
});
document.getElementById('intensity').addEventListener('click', () => {
  intensityLevel = (intensityLevel + 1) % intensities.length;
});
</script>
